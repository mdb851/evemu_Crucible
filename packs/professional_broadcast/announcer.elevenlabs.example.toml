[project]
name = "OOTP 27 Professional Broadcast Announcer"
game = "OOTP 27"

[ootp]
root = ""
pronunciation_file = "data/misc/pronunciation.txt"

[voice]
backend = "elevenlabs"
elevenlabs_voice_id = "iP95p4xoKVk53GoZ742B"
# Default: eleven_turbo_v2_5 for cheaper bulk builds. Use eleven_multilingual_v2 for richer narration.
elevenlabs_model_id = "eleven_turbo_v2_5"
elevenlabs_output_format = "mp3_44100_128"
# Broadcast-friendly defaults: controlled but alive.
elevenlabs_stability = 0.42
elevenlabs_similarity_boost = 0.82
elevenlabs_style = 0.28
# If the API rejects a setting for your model, try style = 0.0 or use_speaker_boost = false.
elevenlabs_use_speaker_boost = true
# Prefer ELEVENLABS_API_KEY in the environment instead of storing the key here.
elevenlabs_api_key = ""

[audio]
extension = "mp3"

[build]
delay_seconds_after_each_line = 0.0
