[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ootp27-realistic-announcer"
version = "0.1.0"
description = "OOTP 27 Realistic Announcer — build CSV-driven voice packs (Piper, ElevenLabs, or custom TTS), manifests, and optional PBP text harvest."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OOTP 27 Realistic Announcer" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
ootp27-announcer = "ootp_announcer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
