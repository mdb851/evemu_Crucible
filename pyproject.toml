[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ootp27-realistic-announcer"
version = "1.1.0"
description = "OOTP 27 Realistic Announcer — build CSV-driven voice packs (Piper, ElevenLabs, or custom TTS), harvest game text, export cues into OOTP data/sounds-style WAVs, and emit manifests."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "OOTP 27 Realistic Announcer" }
]
keywords = [
  "ootp",
  "ootp27",
  "baseball",
  "announcer",
  "tts",
  "voice-pack",
  "elevenlabs",
  "piper",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Simulation",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
ootp27-announcer = "ootp_announcer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
