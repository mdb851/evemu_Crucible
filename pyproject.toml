[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ootp-announcer"
version = "0.1.0"
description = "Local tools for building a realistic OOTP 27 announcer voice pack."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OOTP Announcer Project" }
]
dependencies = []

[project.scripts]
ootp-announcer = "ootp_announcer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
