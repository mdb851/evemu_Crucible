services:
  server:
    image: "evemu_server"
    build: . #Build image from source repository
    container_name: server
    volumes:
      - ./config:/app/etc
      - server_cache:/app/server_cache
      - image_cache:/app/image_cache
    ports:
      - "26000:26000"
      - "26001:26001"
    depends_on:
      - db
    links:
      - "db"
    environment:
      - SEED_MARKET=${SEED_MARKET:-FALSE}
      - SEED_SATURATION=${SEED_SATURATION:-80}
      - SEED_REGIONS=${SEED_REGIONS:-Derelik,The Citadel,The Forge,Essence}
      - RUN_WITH_GDB=${RUN_GDB:-FALSE}
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    ulimits:
      core: -1

  db:
    image: "mariadb:11.8"
    container_name: db
    volumes:
      - db:/var/lib/mysql
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_USER=evemu
      - MARIADB_PASSWORD=evemu
      - MARIADB_DATABASE=evemu

volumes:
  db:
  server_cache:
  image_cache:
