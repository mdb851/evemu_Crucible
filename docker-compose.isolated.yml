# Standalone stack when default `docker-compose.yml` cannot start because
# container names `db`/`server` or host ports 26000–26001 are already taken.
#
#   docker compose -f docker-compose.isolated.yml -p evemu_iso up -d
#
# Server listens on host 26100 (game) and 26101 (proxy); DB is internal only.
# Override names/ports with env if needed.

services:
  db:
    image: "mariadb:11.8"
    container_name: ${EVEMU_ISOLATED_DB_NAME:-evemu_isolated_db}
    volumes:
      - db:/var/lib/mysql
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_USER=evemu
      - MARIADB_PASSWORD=evemu
      - MARIADB_DATABASE=evemu

  server:
    image: "evemu_server"
    build: .
    container_name: ${EVEMU_ISOLATED_SERVER_NAME:-evemu_isolated_server}
    volumes:
      - ./config:/app/etc
      - server_cache:/app/server_cache
      - image_cache:/app/image_cache
    ports:
      - "${EVEMU_ISOLATED_PORT0:-26100}:26000"
      - "${EVEMU_ISOLATED_PORT1:-26101}:26001"
    depends_on:
      - db
    links:
      - "db"
    environment:
      - SEED_MARKET=${SEED_MARKET:-FALSE}
      - SEED_SATURATION=${SEED_SATURATION:-80}
      - SEED_REGIONS=${SEED_REGIONS:-Derelik,The Citadel,The Forge,Essence}
      - RUN_WITH_GDB=${RUN_GDB:-FALSE}
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    ulimits:
      core: -1

volumes:
  db:
  server_cache:
  image_cache:
